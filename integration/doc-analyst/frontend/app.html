<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Document Analyst</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <header class="top-bar">
            <div class="header-inner">
                
                <div class="header-left">
                    <div class="brand-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="2" width="20" height="20" rx="2"></rect>
                            <path d="M12 18h.01"></path>
                            <path d="M8 18h.01"></path>
                            <path d="M16 18h.01"></path>
                            <path d="M12 6v6"></path>
                        </svg>
                    </div>

                    <div class="file-upload-wrapper">
                        <input type="file" id="fileInput" accept=".pdf, .txt" class="hidden-input">
                        <label for="fileInput" class="upload-btn">
                            <span class="status-dot"></span>
                            <span id="fileName">Load Document</span>
                        </label>
                    </div>
                </div>

                <div class="header-right">
                    <div class="actions-group">
                        
                        <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme" id="themeBtn">
                            <svg id="moonIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display: block;">
                                <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-2V4a8 8 0 1 1 0 16z"></path>
                            </svg>
                            <svg id="sunIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                <circle cx="12" cy="12" r="9"></circle>
                                <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"></circle>
                            </svg>
                        </button>

                        <button class="icon-btn" onclick="toggleSelectionMode()" title="Report Mode">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg>
                        </button>
                        
                        <div class="settings-wrapper">
                            <button class="icon-btn" onclick="toggleSettings()" title="Settings">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                                </svg>
                            </button>
                            
                            <div class="settings-popover" id="settingsPanel">
                                <div class="popover-header">Connection Setup</div>
                                <div class="input-group">
                                    <input type="text" id="apiUrlInput" placeholder="Backend URL">
                                </div>
                                <div class="input-group">
                                    <input type="password" id="apiKeyInput" placeholder="API Key" autocomplete="off">
                                </div>
                                <button class="save-btn" onclick="saveConfig()">Save & Connect</button>
                            </div>
                        </div>

                        <a href="../../../web-dashboard/index.html" class="icon-btn" title="Back to Home">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                        </a>

                    </div>
                </div>

            </div>
        </header>

        <main class="main-content">
            <div class="chat-interface" id="chatContainer">
                <div class="message-wrapper bot">
                    <div class="msg-content message">
                        System initialized. Ready for document analysis.
                    </div>
                </div>
            </div>

            <div class="input-region">
                <div class="input-wrapper" id="chatInputBar">
                    <input type="text" id="userQuestion" placeholder="Type your technical query..." autocomplete="off">
                    <button id="sendBtn" onclick="handleSubmission()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>

                <div class="selection-actions" id="selectionBar" style="display: none;">
                    <button class="action-btn secondary" onclick="selectAllMessages()">Select All</button>
                    <div style="display: flex; gap: 10px;">
                        <button class="action-btn cancel" onclick="toggleSelectionMode()">Cancel</button>
                        <button class="action-btn primary" onclick="confirmDownload()">Print Report</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
